[project]
name = "sdmx-alignment-assistant"
version = "0.1.0"
description = "Reuse-first SDMX DSD alignment review assistant"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "openai>=1.50,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "streamlit>=1.40,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["sdmx_alignment"]
